<!-- Componente para agregar hábito -->
<habit-add (onAdd)="addHabit($event)"></habit-add>

<!-- Formulario manual para crear un hábito -->
<form #form="ngForm" class="mt-4" (ngSubmit)="addHabit(newHabit)" novalidate>
  <div class="mb-3">
    <label class="form-label">Nombre del hábito</label>
    <input type="text" class="form-control"
           name="name"
           [(ngModel)]="newHabit.name"
           required maxlength="50"
           placeholder="Ejemplo: Hacer ejercicio diario">
  </div>

  <div class="mb-3">
    <label class="form-label">Categoría</label>
    <input type="text" class="form-control"
           name="category"
           [(ngModel)]="newHabit.category"
           required
           placeholder="Ejemplo: Salud, Estudio, Hogar...">
  </div>

  <div class="mb-3">
    <label class="form-label">Tipo de objetivo</label>
    <select class="form-select"
            name="goalType"
            [(ngModel)]="newHabit.goalType"
            required>
      <option value="" disabled selected>Selecciona un tipo</option>
      <option value="daily">Diario</option>
      <option value="weekly">Semanal</option>
      <option value="monthly">Mensual</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Estado</label>
    <select class="form-select"
            name="status"
            [(ngModel)]="newHabit.status"
            required>
      <option value="" disabled selected>Selecciona un estado</option>
      <option value="In Progress">En progreso</option>
      <option value="Completed">Completado</option>
      <option value="Paused">Pausado</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Notas</label>
    <textarea class="form-control"
              name="notes"
              [(ngModel)]="newHabit.notes"
              maxlength="200"
              rows="3"
              placeholder="Detalles o recordatorios del hábito"></textarea>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="!form.valid">
    Crear Hábito
  </button>
</form>

<!-- 🔹 Barra de filtros y búsqueda -->
<nav class="navbar navbar-light bg-light justify-content-between mt-3">
  <div class="container-fluid">
    <ul class="nav">
      <li class="nav-item">
        <a class="nav-link" href="#" (click)="orderByName()">Ordenar por nombre</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" (click)="orderByProgress()">Ordenar por progreso</a>
      </li>
    </ul>

    <form class="d-flex mb-0">
      <input class="form-control me-2"
             type="text"
             [(ngModel)]="search"
             name="search"
             placeholder="Buscar hábito...">
    </form>
  </div>
</nav>

<!-- 🔹 Lista de hábitos -->
<div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mt-3">
  <div class="col"
       *ngFor="let habit of (habits | habitFilter:search); trackBy: trackById">
    <habit-item [habit]="habit" (onDelete)="deleteHabit(habit)"></habit-item>
  </div>

  <!-- 🔹 Mensaje si no hay hábitos -->
  <div *ngIf="(habits | habitFilter:search).length === 0" class="mt-3 text-center">
    <h3>No hay hábitos registrados</h3>
    <p>Empieza agregando tu primer hábito con el formulario de arriba.</p>
  </div>
</div>
