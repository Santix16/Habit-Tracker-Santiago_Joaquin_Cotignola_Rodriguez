<!-- Componente para agregar hábito -->
<habit-add (onAdd)="addHabit($event)"></habit-add>

<!-- Botón para mostrar/ocultar formulario -->
<button class="btn btn-success mb-3" (click)="toggleNewHabitForm()">
  Nuevo hábito
</button>

<form *ngIf="showNewHabitForm" #form="ngForm" class="mt-4" (ngSubmit)="addHabit(newHabit)" novalidate>

  <!-- Campos del formulario -->
  <div class="mb-3">
    <label class="form-label">Nombre del hábito (obligatorio)</label>
    <input type="text" class="form-control" name="name" [(ngModel)]="newHabit.name" required maxlength="50">
  </div>

  <div class="mb-3">
    <label class="form-label">Categoría (obligatorio)</label>
    <input type="text" class="form-control" name="category" [(ngModel)]="newHabit.category" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Tipo de objetivo</label>
    <select class="form-select" name="goalType" [(ngModel)]="newHabit.goalType" required>
      <option value="daily">Diario</option>
      <option value="weekly">Semanal</option>
      <option value="monthly">Mensual</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Estado</label>
    <select class="form-select" name="status" [(ngModel)]="newHabit.status" required>
      <option value="In Progress">En progreso</option>
      <option value="Completed">Completado</option>
      <option value="Paused">Pausado</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Notas</label>
    <textarea class="form-control" name="notes" [(ngModel)]="newHabit.notes" maxlength="200" rows="3"></textarea>
  </div>

  <!-- Botón siempre habilitado -->
  <button type="submit" class="btn btn-primary">Crear hábito</button>
</form>


<!--  Filtros -->
<div class="filters-container mt-3 mb-3 p-3 border rounded bg-light">
  <h5>Filtros:</h5>

  <div class="row g-3 align-items-end">
    <!-- Categoría -->
    <div class="col-md-4">
      <label class="form-label">Categoría</label>
      <select class="form-select" [(ngModel)]="filterCategory">
        <option value="">Todas</option>
        <option *ngFor="let cat of getUniqueCategories()" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <!-- Tipo -->
    <div class="col-md-4">
      <label class="form-label">Tipo</label>
      <select class="form-select" [(ngModel)]="filterType">
        <option value="">Todos</option>
        <option *ngFor="let type of getUniqueTypes()" [value]="type">{{ type }}</option>
      </select>
    </div>

    <!-- Limpiar filtros -->
    <div class="col-md-4 text-end">
      <button class="btn btn-outline-danger mt-2" (click)="clearFilters()">
        Limpiar filtros
      </button>
    </div>
  </div>

  <!-- Barra de búsqueda -->
  <div class="mt-3">
    <input type="text" class="form-control" [(ngModel)]="search" placeholder="Buscar hábito..." />
  </div>
</div>

<!-- Lista de hábitos -->
<div class="habit-list-container">
  <div class="filter-buttons">
  <h3>Ordenar por:</h3>
  <button class="btn btn-outline-primary" (click)="orderBy('name')">
    Nombre <span *ngIf="orderCriteria === 'name'">{{ orderDirection === 'asc' ? '▲' : '▼' }}</span>
  </button>
  <button class="btn btn-outline-primary" (click)="orderBy('category')">
    Categoría <span *ngIf="orderCriteria === 'category'">{{ orderDirection === 'asc' ? '▲' : '▼' }}</span>
  </button>
  <button class="btn btn-outline-primary" (click)="orderBy('status')">
    Estado <span *ngIf="orderCriteria === 'status'">{{ orderDirection === 'asc' ? '▲' : '▼' }}</span>
  </button>
</div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mt-3">
    <!-- Aquí usamos filteredHabits() para aplicar los filtros -->
    <div class="col" *ngFor="let habit of filteredHabits() | habitFilter:search">
      <habit-item
        [habit]="habit"
        (onViewDetails)="viewDetails($event)">
      </habit-item>
    </div>
  </div>

 <!-- Modal de detalle -->
  <div class="fullscreen-backdrop" *ngIf="selectedHabit">
    <div class="fullscreen-content">
      <habit-detail
        [habit]="selectedHabit"
        (onClose)="closeDetails()"
        (onDelete)="deleteHabit($event)"
        (onEdit)="openEdit($event)">
      </habit-detail>
    </div>
  </div>

  <!-- Modal de edición -->
  <div class="fullscreen-backdrop" *ngIf="editingHabit">
  <div class="fullscreen-content">
    <app-edit-habit
       [habit]="editingHabit"
       (onClose)="closeEdit()"
       (onSave)="saveHabit($event)">
    </app-edit-habit>
  </div>
</div>



  <!-- 🔹 Mensaje si no hay hábitos -->
  <div *ngIf="(filteredHabits() | habitFilter:search).length === 0" class="mt-3 text-center">
    <h3>No hay hábitos registrados</h3>
    <p>Empieza agregando tu primer hábito con el formulario de arriba.</p>
  </div>
</div>
