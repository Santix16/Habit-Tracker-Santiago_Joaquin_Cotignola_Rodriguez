<habit-add (onAdd)="addHabit($event)"></habit-add>

<button class="btn btn-success mb-3" (click)="toggleNewHabitForm()">
  Nuevo hábito
</button>

<form *ngIf="showNewHabitForm" #form="ngForm" class="mt-4" (ngSubmit)="addHabit(newHabit)" novalidate>

  <div class="mb-3">
    <label class="form-label" for="new-habit-name">Nombre del hábito (obligatorio)</label>
    <input id="new-habit-name" type="text" class="form-control" name="name" [(ngModel)]="newHabit.name" required maxlength="50">
  </div>

  <div class="mb-3">
    <label class="form-label" for="new-habit-category">Categoría (obligatorio)</label>
    <input id="new-habit-category" type="text" class="form-control" name="category" [(ngModel)]="newHabit.category" required>
  </div>

  <div class="mb-3">
    <label class="form-label" for="new-habit-goal-type">Tipo de objetivo</label>
    <select id="new-habit-goal-type" class="form-select" name="goalType" [(ngModel)]="newHabit.goalType" required>
      <option value="daily">Diario</option>
      <option value="weekly">Semanal</option>
      <option value="monthly">Mensual</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label" for="new-habit-status">Estado</label>
    <select id="new-habit-status" class="form-select" name="status" [(ngModel)]="newHabit.status" required>
      <option value="In Progress">En progreso</option>
      <option value="Completed">Completado</option>
      <option value="Paused">Pausado</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label" for="new-habit-notes">Notas</label>
    <textarea id="new-habit-notes" class="form-control" name="notes" [(ngModel)]="newHabit.notes" maxlength="200" rows="3"></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Crear hábito</button>
</form>


<div class="filters-container mt-3 mb-3 p-3 border rounded bg-light">
  <h5>Filtros:</h5>

  <div class="row g-3 align-items-end">
    <div class="col-md-4">
      <label class="form-label" for="filter-category">Categoría</label>
      <select id="filter-category" class="form-select" [(ngModel)]="filterCategory">
        <option value="">Todas</option>
        <option *ngFor="let cat of getUniqueCategories()" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label" for="filter-type">Tipo</label>
      <select id="filter-type" class="form-select" [(ngModel)]="filterType">
        <option value="">Todos</option>
        <option *ngFor="let type of getUniqueTypes()" [value]="type">
          {{ type === 'daily' ? 'Diario' : type === 'weekly' ? 'Semanal' : 'Mensual' }}
        </option>
      </select>
    </div>

    <div class="col-md-4 text-end">
      <button class="btn btn-outline-danger mt-2" (click)="clearFilters()">
        Limpiar filtros
      </button>
    </div>
  </div>

  <div class="mt-3">
    <label class="visually-hidden" for="habit-search">Buscar hábito</label>
    <input id="habit-search" type="text" class="form-control" [(ngModel)]="search" placeholder="Buscar hábito..." />
  </div>
</div>

<div class="habit-list-container">
  <div class="filter-buttons">
  <h3>Ordenar por:</h3>
  <button type="button" class="btn btn-outline-primary" (click)="orderBy('name')">
    Nombre <span *ngIf="orderCriteria === 'name'">{{ orderDirection === 'asc' ? '▲' : '▼' }}</span>
  </button>
  <button type="button" class="btn btn-outline-primary" (click)="orderBy('category')">
    Categoría <span *ngIf="orderCriteria === 'category'">{{ orderDirection === 'asc' ? '▲' : '▼' }}</span>
  </button>
  <button type="button" class="btn btn-outline-primary" (click)="orderBy('status')">
    Estado <span *ngIf="orderCriteria === 'status'">{{ orderDirection === 'asc' ? '▲' : '▼' }}</span>
  </button>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mt-3">
    <div class="col" *ngFor="let habit of filteredHabits() | habitFilter:search">
      <habit-item
        [habit]="habit"
        (onViewDetails)="viewDetails($event)">
      </habit-item>
    </div>
  </div>

  <div class="fullscreen-backdrop" *ngIf="selectedHabit">
    <div class="fullscreen-content">
      <habit-detail
        [habit]="selectedHabit"
        (detailClosed)="closeDetails()"
        (habitDeleted)="deleteHabit($event)"
        (editRequested)="openEdit($event)">
      </habit-detail>
    </div>
  </div>

  <div class="fullscreen-backdrop" *ngIf="editingHabit">
  <div class="fullscreen-content">
    <app-edit-habit
       [habit]="editingHabit"
         (editorClosed)="closeEdit()"
           (habitSaved)="saveHabit($event)">
    </app-edit-habit>
  </div>
</div>


  <div *ngIf="(filteredHabits() | habitFilter:search).length === 0" class="mt-3 text-center">
    <h3>No hay hábitos registrados</h3>
    <p>Empieza agregando tu primer hábito con el formulario de arriba.</p>
  </div>
</div>
