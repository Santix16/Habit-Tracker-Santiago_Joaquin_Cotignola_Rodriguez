<!-- Componente para agregar hábito -->
<habit-add (onAdd)="addHabit($event)"></habit-add>

<!-- Formulario manual para crear un hábito -->
<form #form="ngForm" class="mt-4" (ngSubmit)="addHabit(newHabit)" novalidate>
  <div class="mb-3">
    <label class="form-label">Nombre del hábito</label>
    <input type="text" class="form-control"
           name="name"
           [(ngModel)]="newHabit.name"
           required maxlength="50"
           placeholder="Ejemplo: Hacer ejercicio diario">
  </div>

  <div class="mb-3">
    <label class="form-label">Categoría</label>
    <input type="text" class="form-control"
           name="category"
           [(ngModel)]="newHabit.category"
           required
           placeholder="Ejemplo: Salud, Estudio, Hogar...">
  </div>

  <div class="mb-3">
    <label class="form-label">Tipo de objetivo</label>
    <select class="form-select"
            name="goalType"
            [(ngModel)]="newHabit.goalType"
            required>
      <option value="" disabled selected>Selecciona un tipo</option>
      <option value="daily">Diario</option>
      <option value="weekly">Semanal</option>
      <option value="monthly">Mensual</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Estado</label>
    <select class="form-select"
            name="status"
            [(ngModel)]="newHabit.status"
            required>
      <option value="" disabled selected>Selecciona un estado</option>
      <option value="In Progress">En progreso</option>
      <option value="Completed">Completado</option>
      <option value="Paused">Pausado</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Notas</label>
    <textarea class="form-control"
              name="notes"
              [(ngModel)]="newHabit.notes"
              maxlength="200"
              rows="3"
              placeholder="Detalles o recordatorios del hábito"></textarea>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="!form.valid">Crear habito</button>
</form>

<!-- 🔹 Filtros -->
<div class="filters-container mt-3 mb-3 p-3 border rounded bg-light">
  <h5>Filtros:</h5>

  <div class="row g-3 align-items-end">
    <!-- Categoría -->
    <div class="col-md-4">
      <label class="form-label">Categoría</label>
      <select class="form-select" [(ngModel)]="filterCategory">
        <option value="">Todas</option>
        <option *ngFor="let cat of getUniqueCategories()" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <!-- Tipo -->
    <div class="col-md-4">
      <label class="form-label">Tipo</label>
      <select class="form-select" [(ngModel)]="filterType">
        <option value="">Todos</option>
        <option *ngFor="let type of getUniqueTypes()" [value]="type">{{ type }}</option>
      </select>
    </div>

    <!-- Limpiar filtros -->
    <div class="col-md-4 text-end">
      <button class="btn btn-outline-danger mt-2" (click)="clearFilters()">
        Limpiar filtros
      </button>
    </div>
  </div>

  <!-- Barra de búsqueda -->
  <div class="mt-3">
    <input type="text" class="form-control" [(ngModel)]="search" placeholder="Buscar hábito..." />
  </div>
</div>

<!-- 🔹 Lista de hábitos -->
<div class="habit-list-container">
  <div class="filter-buttons">
    <h3>Ordenar por:</h3>
    <button class="btn btn-outline-primary" (click)="orderBy('name')">Nombre</button>
    <button class="btn btn-outline-primary" (click)="orderBy('category')">Categoría</button>
    <button class="btn btn-outline-primary" (click)="orderBy('status')">Estado</button>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mt-3">
    <!-- Aquí usamos filteredHabits() para aplicar los filtros -->
    <div class="col" *ngFor="let habit of filteredHabits() | habitFilter:search">
      <habit-item
        [habit]="habit"
        (onViewDetails)="viewDetails($event)">
      </habit-item>
    </div>
  </div>

<!-- 🔹 Modal de detalle -->
<div class="fullscreen-backdrop" *ngIf="selectedHabit">
  <div class="fullscreen-content">
    <habit-detail
      [habit]="selectedHabit"
      (onClose)="closeDetails()"
      (onDelete)="deleteHabit($event)">
    </habit-detail>
  </div>
</div>

  <!-- 🔹 Mensaje si no hay hábitos -->
  <div *ngIf="(filteredHabits() | habitFilter:search).length === 0" class="mt-3 text-center">
    <h3>No hay hábitos registrados</h3>
    <p>Empieza agregando tu primer hábito con el formulario de arriba.</p>
  </div>
</div>
