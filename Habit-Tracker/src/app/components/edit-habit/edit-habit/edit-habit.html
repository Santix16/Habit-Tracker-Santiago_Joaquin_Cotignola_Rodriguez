<mat-card class="habit-edit-card" appearance="outlined">
  <mat-card-title>Editar hábito: "{{ habit.name }}"</mat-card-title>
  <p></p>

  <mat-card-content>
    <div class="habit-edit-info">
      <div class="field">
        <mat-form-field appearance="outline" class="full-width">
          <label class="visually-hidden" for="habit-name">Nombre</label>
          <mat-label>Nombre</mat-label>
          <input id="habit-name" matInput [(ngModel)]="habit.name" name="name">
        </mat-form-field>
      </div>

      <div class="field">
        <mat-form-field appearance="outline" class="full-width">
          <label class="visually-hidden" for="habit-category">Categoría</label>
          <mat-label>Categoría</mat-label>
          <input id="habit-category" matInput [(ngModel)]="habit.category" name="category">
        </mat-form-field>
      </div>

      <div class="field">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tipo</mat-label>
          <mat-select [(ngModel)]="habit.goalType" name="goalType">
            <mat-option value="daily">Diario</mat-option>
            <mat-option value="weekly">Semanal</mat-option>
            <mat-option value="monthly">Mensual</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Estado</mat-label>
          <mat-select [(ngModel)]="habit.status" name="status">
            <mat-option value="In Progress">En progreso</mat-option>
            <mat-option value="Completed">Completado</mat-option>
            <mat-option value="Paused">Pausado</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field">
        <mat-form-field appearance="outline" class="full-width">
          <label class="visually-hidden" for="habit-notes">Notas</label>
          <mat-label>Notas</mat-label>
          <textarea id="habit-notes" matInput [(ngModel)]="habit.notes" name="notes"></textarea>
        </mat-form-field>
      </div>

    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-flat-button color="primary" (click)="save()">Guardar</button>
    <button mat-flat-button color="warn" (click)="cancel()">Cancelar</button>
  </mat-card-actions>
</mat-card>

<div class="confirmation-backdrop" *ngIf="showConfirmation">
  <section class="confirmation-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmation-title">
    <div class="confirmation-icon" aria-hidden="true">?</div>
    <h2 id="confirmation-title">¿Actualizar hábito?</h2>
    <p>¿Estás seguro de querer actualizar este hábito?</p>
    <div class="confirmation-actions">
      <button type="button" class="confirmation-cancel" (click)="cancelSave()">Volver</button>
      <button type="button" class="confirmation-confirm" (click)="confirmSave()">Actualizar</button>
    </div>
  </section>
</div>
